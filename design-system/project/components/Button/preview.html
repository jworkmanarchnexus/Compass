<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{height:auto}body{background:var(--bg)}</style></head><body>
<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:20px">
<button class="btn primary">Save schedule</button>
<button class="btn">Cancel</button>
<button class="btn quiet">Quiet</button>
<button class="btn danger">Delete</button>
<button class="btn" disabled>Disabled</button>
<button class="btn" aria-pressed="true">Pressed</button>
<button class="btn sm">Small</button>
<button class="btn lg primary">Large</button>
<button class="btn icon" title="Add" aria-label="Add"><i data-i="plus"></i></button>
<button class="btn"><i data-i="download"></i>Export<span class="kbd">E</span></button>
<button class="ib" title="Edit" aria-label="Edit"><i data-i="pencil"></i></button>
<button class="ib del" title="Delete" aria-label="Delete"><i data-i="trash-2"></i></button>
<button class="linkbtn">Link button</button>
</div>
<script>if(window.Toolbox)Toolbox.hydrateIcons();</script></body></html>
